name: Validate Arabic fan website
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build and inspect site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, check SEO and internal links
        env:
          SITE_URL: https://example.pages.dev
        run: |
          python3 -m py_compile build.py magazine.py
          node --check assets/app.js
          node --check assets/magazine.js
          node --check assets/quiz.js
          node --check assets/quiz-data.js
          python3 build.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          root = Path("public")
          pages = sorted(root.rglob("*.html"))
          assert len(pages) >= 32, "Expected original pages plus 19 character profiles, got {}".format(len(pages))
          assert (root / "characters/index.html").is_file()
          assert (root / "characters/ibuki/index.html").is_file()
          assert (root / "characters/ozrock/index.html").is_file()
          assert (root / "assets/styles.css").exists()
          assert (root / "assets/app.js").exists()
          assert (root / "assets/hero.svg").exists()
          assert (root / "assets/portrait-fallback.svg").exists()
          assert (root / "assets/quiz.js").exists()
          assert (root / "assets/quiz-data.js").exists()
          quiz_html = (root / "quiz/index.html").read_text(encoding="utf-8")
          assert "104" in quiz_html
          assert quiz_html.count("data-start-category=") == 7
          assert 'src="/assets/quiz.js?v=2"' in quiz_html
          import json
          quiz_raw = Path("assets/quiz-data.js").read_text(encoding="utf-8")
          quiz_data = json.loads(quiz_raw.split("window.GALAXY_QUIZ_BANK = ",1)[1].rsplit(";",1)[0])
          questions = quiz_data["questions"]
          assert len(questions) >= 100
          assert len(quiz_data["categories"]) == 6
          assert len({q["id"] for q in questions}) == len(questions)
          assert all(len(q["options"]) == 4 and len(set(q["options"])) == 4 and 0 <= q["answer"] < 4 for q in questions)
          assert all(q.get("image") and q.get("explanation") for q in questions)
          assert all(not re.search(r"[A-Za-z]", str(text)) for q in questions for text in [q["question"], q["explanation"], *q["options"]]), "Quiz visible text must use Arabic-only character and team names"
          assert all(not re.search(r"تاكوتو|مونماسا|تيتسوكادو|إيبوكي|ماتاتاغي|شيندو|تسوروغي|تينما", str(text)) for q in questions for text in [q["question"], q["explanation"], *q["options"]]), "Unverified transliterated Japanese names in quiz"
          assert all((root / q["image"].lstrip("/")).exists() for q in questions if q["image"].startswith("/"))
          print("Validated illustrated arcade with {} questions.".format(len(questions)))
          editorial = json.loads(Path("articles_data.json").read_text(encoding="utf-8"))["articles"]
          assert len(editorial) == 11, "Magazine should contain 11 substantive articles"
          assert len({a["slug"] for a in editorial}) == len(editorial)
          assert sum(len(a["sections"]) for a in editorial) >= 50
          assert len([a for a in editorial if a.get("video")]) == 2
          assert (root / "assets/magazine.js").is_file()
          import magazine
          article_page = (root / "articles/index.html").read_text(encoding="utf-8")
          assert article_page.count('data-magazine-card') == len(editorial)
          assert article_page.count('data-load-video') == 2
          assert '<iframe' not in article_page, "YouTube must load only on click"
          assert 'src="/assets/magazine.js?v=1"' in article_page
          for article in editorial:
              path = root / "articles" / article["slug"] / "index.html"
              assert path.exists(), "Missing article page: {}".format(path)
              page_text = path.read_text(encoding="utf-8")
              assert page_text.count('class="magazine-chapter"') >= 4
              assert 'magazine-related-grid' in page_text
              assert 'magazine-reading-progress' in page_text
              assert page_text.count('property="og:image"') == 1
              for key in ('/assets/article-story.svg','/assets/article-hayyan-spotlight.svg','/assets/article-nidal-spotlight.svg'):
                  assert (root / key.lstrip('/')).exists(), key
          print("Validated {} original magazine articles, {} sections and two optional official videos.".format(len(editorial),sum(len(a["sections"]) for a in editorial)))
          assert (root / "robots.txt").exists()
          ET.parse(root / "sitemap.xml")
          for page in pages:
              html = page.read_text(encoding="utf-8")
              assert 'lang="ar"' in html, page
              assert 'dir="rtl"' in html, page
              assert '<meta name="description"' in html or page.name == "404.html", page
              for target in re.findall(r'(?:href|src)="(/[^"?#]*)"', html):
                  path = root / target.lstrip("/")
                  assert path.is_file() or (path / "index.html").is_file(), (page, target)
          print("All {} pages, site navigation and sitemap verified.".format(len(pages)))
          PY